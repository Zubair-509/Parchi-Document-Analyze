kind = "web"
previewPath = "/"
title = "Parchi پرچی"
version = "1.0.0"
id = "artifacts/parchi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21625

[services.development]
run = "pnpm --filter @workspace/parchi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/parchi", "run", "build" ]
publicDir = "artifacts/parchi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21625"
BASE_PATH = "/"
